get_issue:
  system: helpdesk
  kind: read
  description: Fetch a helpdesk issue by id — who raised it, its status and its summary. Comments are read separately.
  input: { issue_id: string }
  op: get
  collection: issues
  id: "${input.issue_id}"
  subject: { collection: issues, id: "${input.issue_id}" }
list_comments:
  system: helpdesk
  kind: read
  description: List the comments on an issue, oldest first.
  input: { issue_id: string }
  op: list
  collection: comments
  where: { issue_id: "${input.issue_id}" }
  order_by: created_at
  subject: { collection: issues, id: "${input.issue_id}" }
add_comment:
  system: helpdesk
  kind: write
  description: Append a comment to an issue, attributed to the service-desk agent. Fails if the issue is unknown.
  input: { issue_id: string, body: text }
  subject: { collection: issues, id: "${input.issue_id}" }
  lookup:
    issue: { collection: issues, id: "${input.issue_id}" }
  op: create
  collection: comments
  new_id: { prefix: cmt_, start: 900 }
  set: { issue_id: "${issue.id}", author: it-helpdesk-agent, body: "${input.body}", created_at: "${now}" }
  returns: { ok: true, comment_id: "${entity.id}", issue_id: "${entity.issue_id}" }
transition_issue:
  system: helpdesk
  kind: write
  description: Move an issue to Open, In Progress or Done. Any other status is rejected, and an issue that is already Done cannot be transitioned again.
  input:
    issue_id: string
    status: { type: enum, values: [Open, In Progress, Done] }
  subject: { collection: issues, id: "${input.issue_id}" }
  lookup:
    issue: { collection: issues, id: "${input.issue_id}" }
  guards:
    - when: "${issue.status == 'Done'}"
      error: "Issue ${issue.id} is already Done; it must be reopened by the service-desk lead."
  op: update
  collection: issues
  id: "${input.issue_id}"
  set: { status: "${input.status}" }
  returns: { ok: true, issue_id: "${entity.id}", status: "${entity.status}" }
