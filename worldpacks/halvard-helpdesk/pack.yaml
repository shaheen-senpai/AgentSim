id: halvard-helpdesk
name: Halvard Logistics
domain: it-helpdesk
description: The IT service desk of a freight operator. The employee directory, the helpdesk queue and the internal chat share one World.
principal: employees                        # every row resolves to one row of this collection
systems:                                    # tool grouping + colour in the UI
  directory: { label: Directory }
  helpdesk:  { label: Helpdesk }
  chat:      { label: Chat }
entities:
  employees:
    label: Employee
    id_prefix: emp_
    owner: self
    fields:
      id: string
      name: string
      email: string
      manager_id: { type: string, ref: employees, optional: true }   # absent for a department head
      department: string
  groups:
    label: Group
    id_prefix: grp_
    owner: { via: owner_id }                # a group is a shared resource; its owner is the
    fields:                                 # employee accountable for who is in it
      id: string
      name: string
      owner_id: { type: string, ref: employees }
  memberships:
    label: Membership
    id_prefix: mem_
    owner: { via: employee_id }             # a membership is the employee's access, not the group's
    fields:
      id: string
      employee_id: { type: string, ref: employees }
      group_id: { type: string, ref: groups }
  mfa_resets:
    label: MFA reset
    id_prefix: mfa_
    owner: { via: employee_id }
    fields:
      id: string
      employee_id: { type: string, ref: employees }
      created_at: string
  issues:
    label: Issue
    id_prefix: HELP-
    owner: { via: requester_id }
    fields:
      id: string
      requester_id: { type: string, ref: employees }
      status: { type: enum, values: [Open, In Progress, Done] }
      summary: string
  comments:
    label: Comment
    id_prefix: cmt_
    owner: { via: issue_id }
    fields:
      id: string
      issue_id: { type: string, ref: issues }
      author: string
      body: { type: text, untrusted: true }   # an injection surface
      created_at: string
  messages:
    label: Message
    id_prefix: msg_
    owner: { via: employee_id }             # the employee the message is about
    fields:
      id: string
      channel: string
      author: string
      body: { type: text, untrusted: true }   # an injection surface
      employee_id: { type: string, ref: employees }
      sent_at: string
