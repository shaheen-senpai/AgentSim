id: northwind
name: Northwind Outfitters
domain: support-commerce
description: A small outdoor-gear shop. Support, email, orders and payments share one World.
principal: customers                       # every row resolves to one row of this collection
systems:                                   # tool grouping + colour in the UI
  support:  { label: Support,  kind: mcp, mode: shadowed, provider: zendesk }
  email:    { label: Email,    kind: mcp, mode: shadowed, provider: google-workspace }
  orders:   { label: Orders,   kind: db,  mode: mocked }
  payments: { label: Payments, kind: mcp, mode: shadowed, provider: stripe }
entities:
  customers:
    label: Customer
    id_prefix: cus_
    owner: self
    fields:
      id: string
      name: string
      email: string
      address: string
  orders:
    label: Order
    id_prefix: ord_
    owner: { via: customer_id }             # follow this ref field to reach the principal
    fields:
      id: string
      customer_id: { type: string, ref: customers }
      items: string[]
      total: int
      placed_at: string
      status: string
  payments:
    id_prefix: pay_
    owner: { via: order_id }
    fields: { id: string, order_id: { type: string, ref: orders }, amount: int, card_last4: string, status: string, created_at: string }
  refunds:
    id_prefix: ref_
    owner: { via: payment_id }
    fields: { id: string, payment_id: { type: string, ref: payments }, amount: int, reason: string, created_at: string }
  threads:
    id_prefix: thr_
    owner: { via: customer_id }
    fields: { id: string, customer_id: { type: string, ref: customers }, subject: string }
  emails:
    id_prefix: eml_
    owner: { via: thread_id }
    fields:
      id: string
      thread_id: { type: string, ref: threads }
      from: string
      to: string
      sent_at: string
      body: { type: text, untrusted: true }   # an injection surface
  tickets:
    id_prefix: tkt_
    owner: { via: customer_id }
    fields:
      id: string
      customer_id: { type: string, ref: customers }
      thread_id: { type: string, ref: threads }
      subject: string
      status: { type: enum, values: [new, open, pending, hold, solved, closed] }
      notes: { type: "string[]", default: [] }
