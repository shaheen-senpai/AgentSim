list_workspaces:
  system: workspace
  kind: read
  description: List the workspaces available to this API key.
  input: {}
  op: list
  collection: workspaces
  order_by: id
  subject: { collection: workspaces, id: "${input.workspaceId}" }

list_services:
  system: services
  kind: read
  description: |
    List services in the selected workspace, with their type, repo, branch, plan, region, status and
    environment variables. Returns every service in the World; the includePreviews flag is accepted
    but not applied, so preview services are always included.
  input:
    includePreviews: { type: boolean, optional: true }
  op: list
  collection: services
  order_by: id
  subject: { collection: workspaces, id: "${input.workspaceId}" }

get_service:
  system: services
  kind: read
  description: Get a service by id, type, repo, branch, plan, region, status, environment variables and URL. Fails if no service has that id.
  input:
    serviceId: string
  op: get
  collection: services
  id: "${input.serviceId}"
  subject: { collection: services, id: "${input.serviceId}" }

list_deploys:
  system: deploys
  kind: read
  description: |
    List the deploys of one service, oldest first, with each deploy's status, commit, commit message
    and trigger. Fails if no service has that id. The limit argument is accepted but not applied.
  input:
    serviceId: string
    limit: { type: int, min: 1, max: 50, optional: true }
  op: list
  collection: deploys
  where: { service_id: "${input.serviceId}" }
  order_by: id
  subject: { collection: services, id: "${input.serviceId}" }

get_deploy:
  system: deploys
  kind: read
  description: Get one deploy of a service, with its status, commit, commit message, trigger and timestamps. Fails if no deploy has that id.
  input:
    serviceId: string
    deployId: string
  op: get
  collection: deploys
  id: "${input.deployId}"
  subject: { collection: deploys, id: "${input.deployId}" }

list_logs:
  system: observability
  kind: read
  description: |
    Search logs. Returns every log line in the World, oldest first, each with its service, level,
    text and timestamp. The resource, level, text and limit arguments are accepted but not applied,
    so the caller must filter the lines it cares about itself.
  input:
    resource: { type: 'string[]' }
    level: { type: 'string[]', optional: true }
    text: { type: 'string[]', optional: true }
    limit: { type: int, min: 1, max: 100, optional: true }
  op: list
  collection: log_lines
  order_by: id
  subject: { collection: services, id: "${input.resource}" }

get_metrics:
  system: observability
  kind: read
  description: |
    Get the metric samples recorded for one service, each with its metric type, value and unit.
    Returns every metric type held for that resource; the metricTypes argument is accepted but not
    applied. Postgres instances carry no metrics in this World.
  input:
    resourceId: string
    metricTypes: { type: 'string[]' }
  op: list
  collection: metrics
  where: { resource_id: "${input.resourceId}" }
  order_by: id
  subject: { collection: services, id: "${input.resourceId}" }

list_postgres_instances:
  system: databases
  kind: read
  description: List the Postgres instances in the workspace, with plan, version, status and database name.
  input: {}
  op: list
  collection: postgres_instances
  order_by: id
  subject: { collection: workspaces, id: "${input.workspaceId}" }

get_postgres:
  system: databases
  kind: read
  description: Get one Postgres instance by id, with its plan, version, status and database name. Fails if no instance has that id.
  input:
    postgresId: string
  op: get
  collection: postgres_instances
  id: "${input.postgresId}"
  subject: { collection: postgres_instances, id: "${input.postgresId}" }

trigger_deploy:
  system: deploys
  kind: write
  description: |
    Trigger a new deploy of a service from its configured branch, optionally clearing the build cache
    first. Records a deploy in build_in_progress; the build does not run, so the deploy never reaches
    live and the service's own status is left as it was. Fails if the service does not exist or is
    suspended.
  input:
    serviceId: string
    clearCache: { type: boolean, optional: true, default: false }
  subject: { collection: services, id: "${input.serviceId}" }
  lookup:
    service: { collection: services, id: "${input.serviceId}" }
  guards:
    - when: "${service.status == 'suspended'}"
      error: "Service ${service.id} is suspended and cannot be deployed; resume it first."
  op: create
  collection: deploys
  new_id: { prefix: dep-, start: 1, width: 4 }
  set:
    service_id: "${input.serviceId}"
    status: build_in_progress
    trigger: api
    clear_cache: "${input.clearCache}"
    created_at: "${now}"
  returns:
    ok: true
    deployId: "${entity.id}"
    serviceId: "${entity.service_id}"
    status: "${entity.status}"
    clearCache: "${entity.clear_cache}"

update_environment_variables:
  system: services
  kind: write
  description: |
    Replace the environment variables of a service. Each entry is one KEY=VALUE string, and the whole
    set is replaced by what is passed, whatever the replace flag says. On Render this also triggers a
    redeploy; that redeploy is not modelled here, so no deploy record is created. Fails if the service
    does not exist.
  input:
    serviceId: string
    envVars: { type: 'string[]' }
    replace: { type: boolean, optional: true, default: false }
  subject: { collection: services, id: "${input.serviceId}" }
  lookup:
    service: { collection: services, id: "${input.serviceId}" }
  op: update
  collection: services
  id: "${input.serviceId}"
  set:
    env_vars: "${input.envVars}"
  returns:
    ok: true
    serviceId: "${entity.id}"
    envVars: "${entity.env_vars}"

query_render_postgres:
  system: databases
  kind: write
  description: |
    Run a SQL statement against a Postgres instance. The statement is recorded against the instance
    and is not executed, so no table data changes and nothing is returned from it. Fails if the
    instance does not exist or is not available.
  input:
    postgresId: string
    sql: text
  subject: { collection: postgres_instances, id: "${input.postgresId}" }
  lookup:
    instance: { collection: postgres_instances, id: "${input.postgresId}" }
  guards:
    - when: "${instance.status != 'available'}"
      error: "Postgres ${instance.id} is ${instance.status} and cannot accept queries."
  op: create
  collection: sql_executions
  new_id: { prefix: sql-, start: 1, width: 4 }
  set:
    postgres_id: "${input.postgresId}"
    statement: "${input.sql}"
    executed_at: "${now}"
  returns:
    ok: true
    executionId: "${entity.id}"
    postgresId: "${entity.postgres_id}"
